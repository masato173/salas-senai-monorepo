# infra/docker/nginx.conf
#
# Serve o build estático do frontend React (SPA) — Controle de Salas SENAI.
#
# SPA fallback: rotas do React Router (BrowserRouter, ver
# apps/reservations/src/router/) não existem como arquivo físico no
# servidor — sem o fallback pra index.html, dar F5 numa rota como
# /admin/usuarios devolveria 404 do nginx em vez de deixar o React Router
# resolver a rota no client.
#
# Sem proxy reverso pro backend aqui — o browser fala direto com a API em
# :3000 (decisão da migração pro servidor local: CORS_ORIGIN no backend +
# VITE_API_URL gravada no bundle do frontend já cobrem isso).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
