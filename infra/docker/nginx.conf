# infra/docker/nginx.conf → /etc/nginx/conf.d/default.conf (contexto http)
#
# Borda única da pilha (ADR-009, issue #21): este nginx serve o frontend
# React (SPA) e é o ÚNICO caminho até a api — a api não publica porta no
# docker-compose.yml. O browser fala só com este nginx (mesma origem): o
# frontend chama a api em /api e o Socket.IO em /api/socket.io.
#
# As rotas ficam em nginx-rotas.conf (incluído abaixo), para um futuro bloco
# 443 (TLS) reaproveitá-las sem reescrita.

# WebSocket (Socket.IO): "Connection: upgrade" só quando o cliente pede
# upgrade; nas demais requisições, "close". Usado em nginx-rotas.conf — o
# `map` só é aceito no contexto http, por isso fica aqui e não no snippet.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    include /etc/nginx/snippets/salas-senai-rotas.conf;
}

# TLS (próximo passo, fora do escopo do #21) — o mesmo include serve o 443, e
# o X-Forwarded-Proto ($scheme) passa a valer "https" sozinho:
#
#   server {
#       listen 443 ssl;
#       server_name <domínio>;
#       ssl_certificate     /etc/letsencrypt/live/<domínio>/fullchain.pem;
#       ssl_certificate_key /etc/letsencrypt/live/<domínio>/privkey.pem;
#       include /etc/nginx/snippets/salas-senai-rotas.conf;
#   }
#
# e o server :80 acima passa a só redirecionar:
# `return 301 https://$host$request_uri;`
