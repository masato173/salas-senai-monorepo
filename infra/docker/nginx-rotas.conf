# infra/docker/nginx-rotas.conf → /etc/nginx/snippets/salas-senai-rotas.conf
#
# Rotas da pilha (contexto server), incluídas pelo nginx.conf no server :80
# e, no futuro, no :443 (ADR-009, issue #21). Depende do
# `map $connection_upgrade` do nginx.conf.
#
#   /api/socket.io/  → http://api:3000/socket.io/  (Socket.IO, WebSocket)
#   /api/            → http://api:3000/            (REST; prefixo /api removido)
#   /                → arquivos do SPA (fallback para index.html)
#
# X-Forwarded-For é SOBRESCRITO com $remote_addr: este nginx é a borda, e o
# valor que o cliente mandar é descartado. A api confia em 1 salto
# (TRUST_PROXY: '1' no docker-compose.yml), então req.ip é o IP que chegou
# aqui — e o rate limiting não pode mais ser contornado forjando o header.
# Se um dia houver CDN ou balanceador à frente deste nginx, use o módulo
# realip (set_real_ip_from + real_ip_header) em vez de confiar em mais saltos.

# DNS interno do Docker. O destino vem de variável ($api_upstream), então o
# nginx resolve "api" na requisição (cache de 10 s) em vez de gravar o IP na
# partida: recriar só o container da api muda o IP, e um host literal no
# proxy_pass daria 502 até reiniciar o nginx (e falharia no `nginx -t` fora
# da rede do compose, com "host not found in upstream").
resolver 127.0.0.11 valid=10s ipv6=off;

root /usr/share/nginx/html;
index index.html;

gzip on;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/xml
    application/xml+rss
    image/svg+xml;

# Socket.IO (namespace /rooms). O frontend conecta na origem do site com
# path '/api/socket.io' (resolveSocketTarget em
# apps/reservations/src/config/api.ts); a api escuta no path padrão
# /socket.io. Conexão longa: 1 h de timeout (o Socket.IO manda ping a cada 25 s).
location /api/socket.io/ {
    set $api_upstream http://api:3000;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $api_upstream;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
}

# API REST: /api/<rota> → /<rota> (a api não tem prefixo global; ex.:
# /api/auth/login → /auth/login, /api/health → /health). Query string
# preservada. 90 s de leitura: o POST /sync/schedules espera o Apps Script
# por até 60 s.
location /api/ {
    set $api_upstream http://api:3000;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $api_upstream;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 90s;
}

# SPA fallback: rotas do React Router (BrowserRouter, ver
# apps/reservations/src/router/) não existem como arquivo físico no
# servidor — sem o fallback pra index.html, dar F5 numa rota como
# /admin/usuarios devolveria 404 do nginx em vez de deixar o React Router
# resolver a rota no client.
location / {
    try_files $uri $uri/ /index.html;
}
