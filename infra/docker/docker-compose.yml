# infra/docker/docker-compose.yml
#
# Stack completa pro servidor local do SENAI: Postgres + backend NestJS +
# frontend React servido por nginx. Substitui Railway (backend) + Supabase
# (banco) + GitHub Pages (frontend) — tudo na rede interna, sem depender de
# nenhum serviço externo.
#
# O nginx (serviço frontend) é a borda única: só a porta 80 é publicada; a
# api e o Postgres ficam só na rede interna (ADR-009, #21).
#
# Uso (a partir de infra/docker/, depois de preencher .env.local — ver
# .env.local.example e README.md deste diretório):
#   docker compose --env-file .env.local build
#   docker compose --env-file .env.local up -d

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    # Sem `ports:` — só a rede interna do compose acessa o Postgres.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - salas-senai

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Sem `ports:` (ADR-009, #21) — a api só é alcançada pela rede interna,
    # através do nginx do serviço frontend (/api/ e /api/socket.io/). Não
    # publique a 3000: acesso direto fura o nginx (X-Forwarded-For forjado
    # contorna o rate limit), e no VPS o ufw NÃO filtra portas publicadas
    # pelo Docker. Para depurar, ver README.md ("Depurar a api").
    environment:
      NODE_ENV: production
      PORT: 3000
      # Docker local: mesmo Postgres pra pool e direct — sem pgbouncer
      # gerenciado como o Supabase em nuvem, então os dois valores são
      # idênticos aqui (diferente de produção Railway/Supabase).
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DIRECT_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN}
      APPS_SCRIPT_URL: ${APPS_SCRIPT_URL}
      APPS_SCRIPT_TOKEN: ${APPS_SCRIPT_TOKEN}
      THROTTLE_SKIP: ${THROTTLE_SKIP}
      # Topologia, não segredo — fixo aqui, não no .env.local: um proxy à
      # frente da api (o nginx do serviço frontend). Obrigatório em produção
      # (env.schema.ts); errar o número reabre a forja de X-Forwarded-For
      # ou junta todos os clientes num IP só (ADR-009, #21).
      TRUST_PROXY: '1'
      # Lido por infra/docker/entrypoint.sh — 'true' só no primeiro boot,
      # depois volta pra 'false' (ver README.md).
      SEED_FORCE: ${SEED_FORCE}
    networks:
      - salas-senai

  frontend:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.frontend
      args:
        # Topologia, fixo aqui (não vem do .env.local): o browser chama a api
        # na mesma origem, pelo nginx desta imagem (ADR-009, #21).
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      - api
    # Única porta publicada da pilha: o nginx é a borda (SPA + /api/).
    ports:
      - '80:80'
    networks:
      - salas-senai

volumes:
  pgdata:

networks:
  salas-senai:
    driver: bridge
