name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '8'

jobs:
  # ── Job 1: Typecheck + Lint + Unit Tests ─────────────────────
  validate:
    name: Typecheck + Lint + Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (frontend)
        run: pnpm --filter @salas-senai/reservations typecheck

      - name: Generate Prisma Client
        working-directory: apps/api
        run: npx prisma generate

      - name: Typecheck (backend)
        run: pnpm --filter @salas-senai/api build

      # Lint removido temporariamente — reativar em F9.8 após configuração do ESLint no CI

      - name: Unit Tests
        run: pnpm --filter @salas-senai/reservations exec vitest run --no-coverage

      - name: Build frontend
        run: pnpm --filter @salas-senai/reservations build

  # ── Job 2: E2E (Playwright) ───────────────────────────────────
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: validate

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
      APPS_SCRIPT_TOKEN: ${{ secrets.APPS_SCRIPT_TOKEN }}
      API_URL: http://localhost:3000
      BASE_URL: http://localhost:5173
      E2E_ADMIN_EMAIL: admin@senai.edu
      E2E_ADMIN_PASSWORD: admin@senai2026
      E2E_PROFESSOR_EMAIL: professor@senai.edu
      E2E_PROFESSOR_PASSWORD: professor@senai2026
      E2E_COORDENADOR_EMAIL: coordenador@senai.edu
      E2E_COORDENADOR_PASSWORD: coordenador@senai2026

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build backend
        run: pnpm --filter @salas-senai/api build

      - name: Run Prisma migrations
        run: pnpm --filter @salas-senai/api exec prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Start backend
        working-directory: apps/api
        run: node dist/main.js &
        env:
          PORT: 3000
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          APPS_SCRIPT_TOKEN: ${{ secrets.APPS_SCRIPT_TOKEN }}

      - name: Wait for backend
        run: npx wait-on http://localhost:3000/health --timeout 60000

      - name: E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
