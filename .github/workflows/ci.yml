name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '8'

jobs:
  # ── Job 1: Typecheck + Lint + Unit Tests ─────────────────────
  validate:
    name: Typecheck + Lint + Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (frontend)
        run: pnpm --filter @salas-senai/reservations typecheck

      - name: Generate Prisma Client
        working-directory: apps/api
        run: npx prisma generate

      - name: Typecheck (backend)
        run: pnpm --filter @salas-senai/api build

      - name: Lint (frontend)
        working-directory: apps/reservations
        run: pnpm exec eslint src --ext .ts,.tsx --max-warnings 0

      - name: Lint (backend)
        working-directory: apps/api
        run: pnpm exec eslint src test --ext .ts

      - name: Unit Tests
        run: pnpm --filter @salas-senai/reservations exec vitest run --no-coverage

      - name: Build frontend
        run: pnpm --filter @salas-senai/reservations build

  # ── Job 2: E2E (Playwright) ───────────────────────────────────
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: validate

    # Banco efêmero do próprio runner — o E2E não depende mais do Supabase.
    # Os secrets DATABASE_URL/DIRECT_URL ficam exclusivos do cd.yml (produção).
    # Credenciais descartáveis: o container nasce e morre com o job.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: salas_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/salas_e2e
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/salas_e2e
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
      APPS_SCRIPT_TOKEN: ${{ secrets.APPS_SCRIPT_TOKEN }}
      API_URL: http://localhost:3000
      BASE_URL: http://localhost:5173
      E2E_ADMIN_EMAIL: admin@senai.edu
      E2E_ADMIN_PASSWORD: admin@senai2026
      E2E_PROFESSOR_EMAIL: professor@senai.edu
      E2E_PROFESSOR_PASSWORD: professor@senai2026
      E2E_COORDENADOR_EMAIL: coordenador@senai.edu
      E2E_COORDENADOR_PASSWORD: coordenador@senai2026

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build backend
        run: pnpm --filter @salas-senai/api build

      # As migrations de RLS da ADR-001 fazem REVOKE ... FROM anon/authenticated
      # sem checar se o role existe — esses roles só existem no Supabase. Num
      # Postgres puro o migrate abortaria com 'role "anon" does not exist'.
      # Cria os dois (NOLOGIN, idempotente); as migrations não são editadas.
      - name: Create Supabase roles (anon, authenticated)
        working-directory: apps/api
        run: |
          pnpm exec prisma db execute --url "$DIRECT_URL" --stdin <<'SQL'
          DO $$ BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN
              CREATE ROLE anon NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN
              CREATE ROLE authenticated NOLOGIN;
            END IF;
          END $$;
          SQL

      - name: Run Prisma migrations
        run: pnpm --filter @salas-senai/api exec prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          DIRECT_URL: ${{ env.DIRECT_URL }}

      # Banco novo não tem usuários — o seed cria admin/professor/coordenador
      # @senai.edu com as mesmas senhas dos E2E_*. O guard de seed.ts só bloqueia
      # com NODE_ENV=production, que este job não define.
      - name: Seed test users
        run: pnpm --filter @salas-senai/api exec prisma db seed
        env:
          DIRECT_URL: ${{ env.DIRECT_URL }}

      - name: Start backend
        working-directory: apps/api
        run: node dist/main.js &
        env:
          PORT: 3000
          DATABASE_URL: ${{ env.DATABASE_URL }}
          DIRECT_URL: ${{ env.DIRECT_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          APPS_SCRIPT_TOKEN: ${{ secrets.APPS_SCRIPT_TOKEN }}
          # F9.2 — desliga o rate limiting no E2E: wait-for-backend faz polling
          # em POST /auth/login e estouraria o limite de 5/min do @Throttle
          THROTTLE_SKIP: 'true'

      - name: Wait for backend
        run: npx wait-on http://localhost:3000/health --timeout 60000

      - name: E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
